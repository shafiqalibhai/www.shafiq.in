  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # editPost:
  #   URL: "https://github.com/shafiqissani/www.shafiq.in/content"
  #   Text: "" # edit text
  #   appendFilePath: false # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

languageCode: en-GB
defaultContentLanguage: "en"
hasCJKLanguage: false

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.8

googleAnalytics: G-XXXXXXXXXX

privacy:
  disqus:
    disable: true
  googleAnalytics:
    anonymizeIP: true
    respectDoNotTrack: true
  youtube:
    privacyEnhanced: true

minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: search
      name: search
      url: /search/
      weight: 9
    - identifier: categories
      name: categories
      url: /categories/
      weight: 11
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
# markup:
#   highlight:
#     noClasses: false
#     anchorLineNos: true
#     codeFences: true
#     guessSyntax: true
#     # lineNos: true
#     style: monokai

outputs:
  home:
    - HTML
    - RSS
    - JSON

related:
  includeNewer: true
  threshold: 60
  toLower: false
  hidden: true
  indices:
    - name: tags
      weight: 100

    - name: categories
      weight: 200

security:
  funcs:
    getenv:
      allow:
        - "^HUGO_"
        - "^CI$"
        - "^WC_POST_CSS$"
        - "WC_POST_CSS"
        - ^WC_
