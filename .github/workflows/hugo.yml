# Hugo Site Build and Deploy to GitHub Pages
# This workflow builds a Hugo site with best practices:
# - Caches dependencies for faster builds
# - Validates configuration before deployment
# - Minifies and optimizes output
# - Deploys to GitHub Pages
#
# For more information: https://github.com/actions/deploy-pages

name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - "config/**"
      - "archetypes/**"
      - "assets/**"
      - "layouts/**"
      - "themes/**"
      - "static/**"
      - ".github/workflows/hugo.yml"

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# Set permissions for GitHub Token
permissions:
  contents: read
  pages: write
  id-token: write

# Use bash for all shell commands
defaults:
  run:
    shell: bash

env:
  # Hugo version to use
  HUGO_VERSION: "0.155.2"
  # Node version for dependencies
  NODE_VERSION: "20"

jobs:
  # Configuration validation job
  validate:
    runs-on: ubuntu-latest
    name: Validate Configuration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Validate Hugo Configuration
        run: |
          echo "🔍 Validating Hugo configuration..."
          hugo config > /dev/null
          echo "✓ Configuration valid"

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: validate
    name: Build Site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Full history for git info

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          else
            echo "No package lock file found, skipping npm ci"
          fi

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('content/**', 'assets/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          echo "📦 Building Hugo site..."
          hugo \
            --minify \
            --gc \
            --enableGitInfo \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --verbose

          echo ""
          echo "📊 Build Statistics:"
          du -sh public/
          find public -type f | wc -l
          echo "files generated"

      - name: Validate Build Output
        run: |
          if [ ! -d "public" ] || [ ! -f "public/index.html" ]; then
            echo "❌ Build output validation failed: public/index.html not found"
            exit 1
          fi
          echo "✓ Build output valid"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          retention-days: 1

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "✅ Site deployed successfully!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
